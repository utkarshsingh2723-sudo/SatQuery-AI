<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#0b1220"/>

  <!-- input -->
  <rect x="290" y="30" width="320" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="450" y="63" text-anchor="middle" font-family="Arial" font-size="17" fill="#e2e8f0">GUI — image + text query</text>

  <line x1="450" y1="84" x2="450" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- router -->
  <rect x="270" y="126" width="360" height="66" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="450" y="152" text-anchor="middle" font-family="Arial" font-size="18" font-weight="600" fill="#e0e7ff">Router / Agent</text>
  <text x="450" y="174" text-anchor="middle" font-family="Arial" font-size="13" fill="#a5b4fc">VLM decides which tool to call</text>

  <line x1="450" y1="192" x2="450" y2="222" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="222" x2="750" y2="222" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="222" x2="150" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="222" x2="350" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="222" x2="550" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="222" x2="750" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 tools -->
  <g font-family="Arial">
    <rect x="80" y="248" width="140" height="66" rx="10" fill="#134e4a" stroke="#14b8a6"/>
    <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#99f6e4">VQA</text>
    <text x="150" y="296" text-anchor="middle" font-size="11" fill="#5eead4">Visual Q&amp;A</text>

    <rect x="280" y="248" width="140" height="66" rx="10" fill="#134e4a" stroke="#14b8a6"/>
    <text x="350" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#99f6e4">Change</text>
    <text x="350" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#99f6e4">Detection</text>
    <text x="350" y="304" text-anchor="middle" font-size="11" fill="#5eead4">Bi-temporal diff</text>

    <rect x="480" y="248" width="140" height="66" rx="10" fill="#134e4a" stroke="#14b8a6"/>
    <text x="550" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#99f6e4">Optical–SAR</text>
    <text x="550" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#99f6e4">Fusion</text>
    <text x="550" y="304" text-anchor="middle" font-size="11" fill="#5eead4">Joint analysis</text>

    <rect x="680" y="248" width="140" height="66" rx="10" fill="#134e4a" stroke="#14b8a6"/>
    <text x="750" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#99f6e4">Scene</text>
    <text x="750" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#99f6e4">Classify</text>
    <text x="750" y="304" text-anchor="middle" font-size="11" fill="#5eead4">Extra single-image task</text>
  </g>

  <line x1="150" y1="314" x2="150" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="350" y1="314" x2="350" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="550" y1="314" x2="550" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="750" y1="314" x2="750" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="350" x2="750" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="350" x2="450" y2="382" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- synthesis -->
  <rect x="270" y="382" width="360" height="60" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="450" y="408" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#e0e7ff">Response Synthesis</text>
  <text x="450" y="428" text-anchor="middle" font-family="Arial" font-size="12" fill="#a5b4fc">Formats tool output into a plain-language answer</text>

  <line x1="450" y1="442" x2="450" y2="472" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="472" width="400" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="450" y="504" text-anchor="middle" font-family="Arial" font-size="16" fill="#e2e8f0">Answer + visual overlay → back to GUI</text>

  <text x="450" y="570" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">SatQuery AI — agentic orchestrator architecture</text>
</svg>
