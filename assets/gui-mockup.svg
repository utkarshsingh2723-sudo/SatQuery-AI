<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="620" fill="#0b1220"/>
  <!-- browser chrome -->
  <rect x="20" y="20" width="960" height="580" rx="12" fill="#111827" stroke="#334155"/>
  <rect x="20" y="20" width="960" height="40" rx="12" fill="#1e293b"/>
  <circle cx="42" cy="40" r="6" fill="#ef4444"/>
  <circle cx="62" cy="40" r="6" fill="#eab308"/>
  <circle cx="82" cy="40" r="6" fill="#22c55e"/>
  <text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="13" fill="#94a3b8">localhost:8501 — SatQuery AI</text>

  <!-- sidebar -->
  <rect x="20" y="60" width="240" height="540" fill="#0f172a" stroke="#1e293b"/>
  <text x="40" y="95" font-family="Arial" font-size="14" font-weight="600" fill="#e2e8f0">Upload Imagery</text>
  <rect x="40" y="110" width="200" height="90" rx="8" fill="none" stroke="#334155" stroke-dasharray="6,4"/>
  <text x="140" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Drop GeoTIFF / TIFF</text>
  <text x="140" y="168" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">or click to browse</text>

  <text x="40" y="230" font-family="Arial" font-size="13" font-weight="600" fill="#e2e8f0">Input mode</text>
  <rect x="40" y="242" width="200" height="30" rx="6" fill="#134e4a" stroke="#14b8a6"/>
  <text x="52" y="262" font-family="Arial" font-size="12" fill="#5eead4">● Single image</text>
  <rect x="40" y="278" width="200" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="298" font-family="Arial" font-size="12" fill="#94a3b8">○ Optical–SAR pair</text>
  <rect x="40" y="314" width="200" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="334" font-family="Arial" font-size="12" fill="#94a3b8">○ Bi-temporal pair</text>

  <!-- main panel -->
  <rect x="280" y="60" width="680" height="460" fill="#0b1220"/>
  <rect x="300" y="80" width="220" height="160" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="410" y="165" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">[ preview thumbnail ]</text>

  <!-- chat bubbles -->
  <rect x="540" y="80" width="380" height="46" rx="10" fill="#1e293b"/>
  <text x="556" y="108" font-family="Arial" font-size="13" fill="#cbd5e1">"How many buildings are visible in this image?"</text>

  <rect x="560" y="136" width="380" height="70" rx="10" fill="#134e4a"/>
  <text x="576" y="160" font-family="Arial" font-size="12" fill="#99f6e4">Router → VQA tool</text>
  <text x="576" y="180" font-family="Arial" font-size="13" fill="#e2e8f0">"Approximately 14 buildings are visible,</text>
  <text x="576" y="196" font-family="Arial" font-size="13" fill="#e2e8f0">clustered in the lower-right quadrant."</text>

  <rect x="300" y="260" width="620" height="46" rx="10" fill="#1e293b"/>
  <text x="316" y="288" font-family="Arial" font-size="13" fill="#cbd5e1">"What changed between these two dates?"</text>

  <rect x="320" y="316" width="600" height="90" rx="10" fill="#312e81"/>
  <text x="336" y="340" font-family="Arial" font-size="12" fill="#a5b4fc">Router → Change Detection tool</text>
  <text x="336" y="360" font-family="Arial" font-size="13" fill="#e0e7ff">"A new cluster of structures has appeared in the</text>
  <text x="336" y="378" font-family="Arial" font-size="13" fill="#e0e7ff">northern section; vegetation cover has decreased ~12%."</text>

  <!-- query bar -->
  <rect x="300" y="440" width="620" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
  <text x="322" y="468" font-family="Arial" font-size="13" fill="#64748b">Ask a question about your imagery…</text>
  <circle cx="890" cy="463" r="18" fill="#14b8a6"/>
  <path d="M884 463 L896 463 M891 456 L898 463 L891 470" stroke="#0b1220" stroke-width="2" fill="none"/>
</svg>
